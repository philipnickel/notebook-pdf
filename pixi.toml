# Workspace + package: https://pixi.prefix.dev/latest/build/backends/pixi-build-rattler-build/
[workspace]
name = "notebook-pdf"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

# Name, version and contents come from recipe/recipe.yaml
[package]
name = "notebook-pdf"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "0.*"

[dependencies]
python = "3.12.*"
# The package itself, built from source; pixi rebuilds it whenever recipe/ changes
notebook-pdf = { path = "." }

[tasks]
e2e = "python tests/check_pdf.py"
