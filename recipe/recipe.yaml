# rattler-build recipe: https://rattler.build/latest/reference/recipe_file/
# Built by pixi (see pixi.toml); tested by `pixi run e2e`
context:
  version: "0.1.0"

package:
  name: notebook-pdf
  version: ${{ version }}

source:
  - path: jupyter_nbconvert_config.json
  - path: ../LICENSE

build:
  number: 0
  noarch: generic
  # Jupyter reads {sys.prefix}/etc/jupyter on every OS, so one noarch build covers all platforms
  script:
    - if: win
      then:
        - mkdir %PREFIX%\etc\jupyter
        - copy jupyter_nbconvert_config.json %PREFIX%\etc\jupyter\
      else:
        - mkdir -p $PREFIX/etc/jupyter
        - cp jupyter_nbconvert_config.json $PREFIX/etc/jupyter/

requirements:
  run:
    - nbconvert-core >=7
    - pandoc
    # -Z continue-on-errors is an unstable option; re-test before widening this range
    - tectonic >=0.17,<0.18

about:
  homepage: https://github.com/philipnickel/notebook-pdf
  repository: https://github.com/philipnickel/notebook-pdf
  summary: Make nbconvert (and VS Code "Export to PDF") compile with tectonic instead of xelatex
  description: |
    Drops an environment-level jupyter_nbconvert_config.json into $PREFIX/etc/jupyter that
    points nbconvert's PDFExporter at tectonic. Tectonic fetches only the LaTeX packages a
    document needs on first use, so no TeX Live install is required.
  license: BSD-3-Clause
  license_file: LICENSE
